<script>
(() => {
'use strict';

/* =====================================================================
   VORTEX BLAST — dynamic rotating cluster blast
   Single-file HTML5 Canvas game. Logical resolution 540x960 (9:16),
   letterboxed to any screen. Vanilla JS, Web Audio, localStorage meta.
   ===================================================================== */

// ---------------------------------------------------------------- config
const W = 540, H = 960;
const TAU = Math.PI * 2;
const CX = 270, CY = 486;                 // vortex centre
const RINGS = 4, SLOTS = 12, DA = TAU / SLOTS;
const RING_IN = [62, 111, 160, 209];      // inner radius of each ring
const RING_T = 44;                        // ring thickness
const ringMid = r => RING_IN[r] + RING_T / 2;
const SPRING_K = 560, SPRING_C = 24;      // block snap spring (under-damped = jelly bounce)
const BUILD = '2.0.0';
const HANDLE_H = 66, DRAWER_H = 528;
const GEM_PILL = { x: 400, y: 24, w: 120, h: 42 };
const MUTE_BTN = { x: 42, y: 45, r: 23 };
const PLAY_BTN_TITLE = { x: 145, y: 768, w: 250, h: 78 };
const PLAY_BTN_OVER = { x: 130, y: 602, w: 280, h: 74 };

const FD = "'Lilita One','Arial Rounded MT Bold','Arial Black',Impact,sans-serif";
const FB = "'Fredoka','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif";

const COLORS = [
  { base:'#ff3b55', dark:'#b5122f', light:'#ff9aa8', deep:'#5c0616', ico:'#ffe4e8', rgb:'255,70,95',  icon:'flame' },
  { base:'#2e8bff', dark:'#1446b4', light:'#a3d3ff', deep:'#0a2466', ico:'#e6f3ff', rgb:'70,155,255', icon:'drop'  },
  { base:'#ffc928', dark:'#d07a00', light:'#fff1a6', deep:'#6b3d00', ico:'#fffadf', rgb:'255,210,50', icon:'star'  },
  { base:'#2fd457', dark:'#0e8a32', light:'#aaf8b8', deep:'#06461a', ico:'#e6ffeb', rgb:'70,225,110', icon:'leaf'  },
];

// ---------------------------------------------------------------- utils
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
// Gameplay RNG (block colours): seedable, so a run can be replayed in tests and a Daily Challenge can
// share one board. Cosmetic randomness (particles, shake, spawn offsets) stays on Math.random.
let rngState = (Math.random() * 4294967296) >>> 0;
const seedRng = seed => { rngState = seed >>> 0; };
function rng() {   // mulberry32
  rngState = (rngState + 0x6D2B79F5) | 0;
  let t = Math.imul(rngState ^ (rngState >>> 15), rngState | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
// Test hooks and URL overrides only on ?debug=1 or a local server.
const DEBUG = /[?&]debug=1(&|$)/.test(location.search) || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
const qparam = k => { const m = new RegExp('[?&]' + k + '=([^&]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : null; };
const hash32 = s => { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); } return h >>> 0; };   // FNV-1a

// ---------------------------------------------------------------- tuning config (F-036, F-019)
// Every balance number lives here. Defaults = the FINAL set validated in docs/tools/vb_final.py.

// split players by a hash of their id and patch the config per variant.
const CFG_DEFAULT = {
  drain: { base: 7, perWave: 1.15, cap: 24, postCap: 0.6, ramp: 1.5 },
  combo: { window: 1.8, decay: 0.12, min: 0.7 },               // window shrinks as the combo grows
  bombRefill: 20, gemRate: 0.13, gemMultStep: 0.125, waveFromBaseScore: true,
  content: {

    bossEvery: 5, bossSecs: 20, bossSpeed: -1.6, bossLockMult: 1.5, bossGems: 20,
  },
  // provider 'auto' = AdMob inside the native app, H5 Games Ads on the web when a client id is set, else none.
  // interstitialEveryRuns 0 = off (ADR-3: rewarded first; run-end interstitials only as experiment E4).
  ads: { provider: 'auto', h5Client: '', admobRewardedId: '', admobInterstitialId: '', revivePerRun: 1,
    doubleGemsPerDay: 5, interstitialEveryRuns: 0 },

// Gameplay gems: CFG.gemRate scales every in-run source; the fraction carries over to the next award

function addGems(g, x, y) {

  g = Math.floor(save.gemFrac + 1e-9); save.gemFrac -= g;

function grantGems(g, x, y) { if (g > 0) { gemFly(g, x, y); markDirty(); } }
function gemFly(g, x, y) {

function updateParticles(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.t += dt;
    if (p.t >= 0) {
      if (p.k === 'dot' || p.k === 'star' || p.k === 'shard') {
        const d = Math.exp(-p.drag * dt); p.vx *= d; p.vy *= d; p.vy += (p.g || 0) * dt;
        p.x += p.vx * dt; p.y += p.vy * dt; if (p.vr) p.rot += p.vr * dt;
      } else if (p.k === 'ring') {
        p.r = Math.max(0, p.r + p.gr * dt * (1 - 0.6 * p.t / p.life));
      } else if (p.k === 'text') {
        p.y += p.vy * dt; p.vy *= Math.exp(-2.5 * dt);
      }
    }
    if (p.t >= p.life) {
      if (p.k === 'orb') corePulse = Math.min(1, corePulse + 0.1);
      else if (p.k === 'gem') { gemsInFlight -= p.val; gemBounce = 1; Snd.tink(); }
      parts[i] = parts[parts.length - 1]; parts.pop();
    }
  }
}
function updateDust(dt) {
  for (const d of dust) {
    d.r -= (14 + (640 - d.r) * 0.12) * d.sp * dt;
    d.a += dt * (0.18 + 26 / Math.max(d.r, 30));
    if (d.r < 58) Object.assign(d, newDust(false));
  }
}

function tapBoard(x, y) {
  if (hitStop > 0 || pending) return;
  const dx = x - CX, dy = y - CY, d = Math.hypot(dx, dy), a = Math.atan2(dy, dx);
  let r = -1, bd = 1e9;
  for (let i = 0; i < RINGS; i++) { const dd = Math.abs(d - ringMid(i)); if (dd < bd) { bd = dd; r = i; } }
  if (bd > RING_T / 2 + 12) return;
  const s = closest(r, a), b = grid[r][s];
  if (!b || !isSettled(b)) return;
  if (b.bomb) {
    for (let k = 0; k < SLOTS; k++) if (grid[r][k]) grid[r][k].flash = 0.7;
    b.flash = 1; pending = { type: 'bomb', r, s }; hitStop = 0.05; boardPunch = 1.6;
    return;
  }
  if (b.cb) {
    for (let rr = 0; rr < RINGS; rr++) for (let ss = 0; ss < SLOTS; ss++) { const o = grid[rr][ss]; if (o && !isSpecial(o) && o.c === b.c) o.flash = 0.8; }
    b.flash = 1; pending = { type: 'cbomb', r, s }; hitStop = 0.05; boardPunch = 1.4;
    return;
  }
  const cl = b.cl >= 0 ? clusters[b.cl] : null;
  if (b.ready && cl && cl.length >= 3) {
    for (const c of cl) grid[c.r][c.s].flash = 1;
    pending = { type: 'cluster', cells: cl.slice(), tap: { r, s } };
    hitStop = 0.030;                  // 30 ms hit-stop before the pop
    boardPunch = 1;
  } else { b.wob = 1; Snd.nope(); }
}
function resolvePending() {
  const p = pending; pending = null;
  if (p.type === 'cluster') doBlast(p.cells, p.tap);
  else if (p.type === 'bomb') doBomb(p.r);
  else doCBomb(p.r, p.s);
}
function bumpCombo() {

// Free locked blocks next to anything that blasts (same ring sides + radial neighbours).
function unlockAround(cells) {

    const nb = grid[nr][ns];

      const w = blockWorld(nr, ns, nb);

}
function doBlast(cells, tap) {

function doBomb(r) {

// Colour Bomb (F-022): every block of its colour (locked ones too) plus itself.
function doCBomb(r, s) {

// Bookkeeping shared by a collapse and a quit: bests, stats, history, streak, quests, achievements.
function endRun(quit = false) {
  const best0 = mode === 'zen' ? save.zenBest : save.best;
  newBest = !quit && mode !== 'daily' && score > best0;
  if (mode === 'zen') { if (score > save.zenBest) save.zenBest = score; }
  else if (mode === 'endless' && score > save.best) save.best = score;
  if (mode === 'daily' && officialDaily) save.challenge.best = Math.max(save.challenge.best, score);
  const st = save.stats;
  st.runs++; st.blasts += blasts; st.bombs += bombsMade; st.maxCombo = Math.max(st.maxCombo, maxCombo);
  st.maxWave = Math.max(st.maxWave, wave); st.playSec = Math.round(st.playSec + timeAlive);
  if (mode === 'endless' && !quit) save.streak = wave >= 5 ? save.streak + 1 : 0;
  save.history.unshift({ at: new Date().toISOString().slice(0, 16), mode, score, wave, sec: Math.round(timeAlive), gems: runGems, seed: runSeed });
  save.history.length = Math.min(save.history.length, 10);
  Quests.add('runs', 1); Quests.add('gems', runGems); Quests.best('score', score); Quests.best('time', Math.round(timeAlive));
  checkAchievements();
  Track.ev('run_end', { mode, score, wave, dur: Math.round(timeAlive), blasts, max_combo: maxCombo, gems: runGems,
    revived: revivesUsed, quit: quit ? 1 : 0, tampered: save.tampered ? 1 : 0 });

}

// ---------------------------------------------------------------- analytics (F-001)
// Events go to a local ring buffer (≤ 200, localStorage). They leave the device only with the player's
// analytics consent AND an endpoint in config; without consent no player id is attached at all.
const variantsKey = () => Object.keys(variants).map(k => k + ':' + variants[k]).join(',');
const Track = (() => {
  const QKEY = 'vortexBlast.q', MAX = 200, sid = Math.random().toString(36).slice(2, 10), counts = {};
  let q = [], since = 0;
  try { const x = JSON.parse(localStorage.getItem(QKEY) || '[]'); if (Array.isArray(x)) q = x.slice(-MAX); } catch (e) {}
  const store = () => { try { localStorage.setItem(QKEY, JSON.stringify(q)); } catch (e) {} };
  function ev(e, p) {
    counts[e] = (counts[e] || 0) + 1;
    const rec = Object.assign({ e, ts: Date.now(), sid, v: BUILD, var: variantsKey(), platform: platformName() }, p);
    if (save.consent.analytics) rec.uid = save.uid;
    q.push(rec);
    if (q.length > MAX) q.splice(0, q.length - MAX);
  }
  function flush() {
    store();
    const url = CFG.analytics.endpoint;
    if (!url || !save.consent.analytics || !q.length || !navigator.sendBeacon) return;
    try { if (navigator.sendBeacon(url, JSON.stringify(q))) { q = []; store(); } } catch (e) {}
  }
  function tick(dt) { since += dt; if (since >= CFG.analytics.flushSec) { since = 0; flush(); } }
  return { ev, flush, tick, counts, get queue() { return q; } };
})();
const platformName = () => window.Capacitor ? 'native' : (matchMedia('(display-mode: standalone)').matches ? 'pwa' : 'web');

// ---------------------------------------------------------------- weekend events (F-041)
// Built-in rotation by week number (Sat/Sun); CFG.events [{from, to, type}] (ISO times) replaces it.
const EVENT_ROTATION = ['gems', 'bomb', 'quest', 'combo'];
let evCache = { k: '', v: '' };
function eventToday() {
  const now = new Date(), k = dayKey(now) + now.getHours();
  if (evCache.k === k) return evCache.v;
  let v = '';

    const iso = now.toISOString(), e = CFG.events.find(e => e && e.from <= iso && iso < e.to);
    v = e && EVENT_ROTATION.includes(e.type) ? e.type : '';

}
const gemEventMult = () => eventToday() === 'gems' ? 2 : 1;

  ['bombs', 'add', [2, 4, 6]], ['wave', 'best', [6, 9, 12]], ['score', 'best', [20000, 40000, 80000]],
  ['runs', 'add', [3, 5, 8]], ['cross', 'add', [10, 20, 30]], ['joker', 'add', [1, 2, 3]],

// ---------------------------------------------------------------- season pass-lite (F-040)

const SEASON_TIERS = 30, SEASON_PTS = 70;

  ensure() { if (save.season.id !== seasonId()) { save.season = { id: seasonId(), pts: 0, claimed: 0 }; markDirty(); } },
  addPts(p) { Season.ensure(); save.season.pts += p; markDirty(); },

// ---------------------------------------------------------------- tutorial (F-006)
// Step 0 tap a group → 1 cross-ring group → 2 drain/refill → 3 forge a bomb → 4 use it → 5 ramp to normal.
let ftueStep = -1, ftueT = 0, ftueDipped = false;
function ftueSet(n) { ftueStep = n; ftueT = 0; Track.ev('ftue_step', { step: n }); }
function ftueDrainK() {
  if (ftueStep < 0) return 1;
  return [0, 0, 0.4, 0.5, 0.5][ftueStep] ?? Math.min(1, 0.5 + ftueT / 20);
}
function ftueSetupBoard() {
  // make sure the very first tap has an obvious target: three neighbours in the inner ring
  ftueT = 0; ftueDipped = false; Track.ev('ftue_step', { step: 0 });
  const c = grid[0][0] ? grid[0][0].c : 0;
  for (let s = 0; s < 3; s++) { const b = newBlock(c); grid[0][s] = b; }
}
function ftueOnBlast(cells, cross) {
  if (ftueStep === 0) ftueSet(1);
  else if (ftueStep === 1 && (cross || ftueT > 20)) ftueSet(2);
  else if (ftueStep === 2 && ftueDipped) ftueSet(3);
  if (ftueStep === 3 && bombsMade > 0) ftueSet(4);
}
function ftueOnBomb() { if (ftueStep === 4) ftueSet(5); }
function ftueUpdate(dt) {
  if (ftueStep < 0) return;
  ftueT += dt;
  if (ftueStep === 2 && stability < 85) ftueDipped = true;
  if (ftueStep === 3 && ftueT > 25 && !bombOnBoard) {       // no 6+ group came up: hand them a bomb
    const s = (Math.random() * SLOTS) | 0, bomb = newBlock(-1, true); bomb.sc = 0.2; bomb.vs = 6;
    grid[0][s] = bomb; bombsMade++; banner(t('ftue.3g'), 46, '#d6a8ff', 1.3, 260); ftueSet(4);
  }
  if (ftueStep === 5 && ftueT > 10) { ftueStep = -1; save.ftue = 1; Track.ev('ftue_step', { step: 'done' }); persist(); }
}
function ftueSkip() { ftueStep = -1; save.ftue = 1; Track.ev('ftue_step', { step: 'skip' }); persist(); }
// where the tutorial hand points: the target cluster/bomb for the current step
function ftueTarget() {
  if (ftueStep === 4) {
    for (let r = 0; r < RINGS; r++) for (let s = 0; s < SLOTS; s++) if (grid[r][s] && grid[r][s].bomb) return blockWorld(r, s, grid[r][s]);
    return null;
  }
  if (ftueStep > 1) return null;
  let best = null, bestN = 0;
  for (const cl of clusters) {
    if (cl.length < 3) continue;
    const cross = new Set(cl.map(c => c.r)).size > 1;
    const n = cl.length + (ftueStep === 1 && cross ? 100 : 0);
    if (n > bestN) { bestN = n; best = cl; }
  }
  if (!best || (ftueStep === 1 && bestN < 100)) return null;
  const c = best[0];
  return blockWorld(c.r, c.s, grid[c.r][c.s]);
}

// ---------------------------------------------------------------- update
function update(dt) {
  T += dt;
  drawerT += ((drawerOpen ? 1 : 0) - drawerT) * Math.min(1, dt * 14);
  for (let i = 0; i < UPGRADES.length; i++) { btnPress[i] = Math.max(0, btnPress[i] - dt * 4); cardShake[i] = Math.max(0, cardShake[i] - dt * 3); cardFlash[i] = Math.max(0, cardFlash[i] - dt * 2); }
  gemBounce = Math.max(0, gemBounce - dt * 4); playPress = Math.max(0, playPress - dt * 4);
  modalT = Math.min(1, modalT + dt * 6);
  if (saveDirty) { saveTimer -= dt; if (saveTimer <= 0) persist(); }
  Track.tick(dt); Music.tick();
  if (hitStop > 0) {                       // frozen frame: everything holds still
    hitStop -= dt;
    if (hitStop <= 0) { hitStop = 0; if (pending) resolvePending(); }
    return;
  }
  if (state === 'revive') {
    reviveT += dt;
    if (reviveT > 4.5 && !Ads.busy) gameOver();   // offer times out
    return;
  }
  if (state === 'play' && (drawerOpen || autoPaused || paused || (modal && modal.pausesGame))) return;
  if (state === 'play' && resumeT > 0) { resumeT -= dt; return; }
  // F-038: last-chance slow motion runs the simulation at half speed
  if (slowT > 0) { slowT -= dt; dt *= 0.5; }
  simulate(dt);
}

function simulate(dt) {
  simT += dt;
  applyMagnet(dt);
  for (let r = 0; r < RINGS; r++) ringAng[r] = (ringAng[r] + (ringSpeed(r) + ringMag[r]) * dt) % TAU;

  const steps = dt > 0.018 ? 2 : 1, h = dt / steps;
  for (let r = 0; r < RINGS; r++) for (let s = 0; s < SLOTS; s++) {
    const b = grid[r][s]; if (!b) continue;
    for (let k = 0; k < steps; k++) {
      const pdr = b.dr;
      b.vr += (-SPRING_K * b.dr - SPRING_C * b.vr) * h; b.dr += b.vr * h;
      b.va += (-SPRING_K * b.da - SPRING_C * b.va) * h; b.da += b.va * h;
      b.vs += (-260 * (b.sc - 1) - 13 * b.vs) * h; b.sc += b.vs * h;
      if (pdr > 0 && b.dr <= 0 && b.vr < -250) { b.jel = Math.min(1, -b.vr / 1100); b.jelP = 0; }
    }
    b.jelP += dt * 30; b.jel *= Math.exp(-dt * 5);
    b.wob = Math.max(0, b.wob - dt * 2.5);
    b.flash = Math.max(0, b.flash - dt * 5);
    b.glow += ((b.ready ? 1 : 0) - b.glow) * Math.min(1, dt * 12);
  }
  computeClusters();
  updateParticles(dt);
  updateDust(dt);

  shake *= Math.exp(-dt * 9); if (shake < 0.1) shake = 0;
  flashA = Math.max(0, flashA - dt * 2.2);
  corePulse = Math.max(0, corePulse - dt * 2.5);
  boardPunch = Math.max(0, boardPunch - dt * 6);
  comboPop = Math.max(0, comboPop - dt * 3);
  barFlash = Math.max(0, barFlash - dt * 3);
  dispScore += (score - dispScore) * Math.min(1, dt * 10); if (Math.abs(score - dispScore) < 1) dispScore = score;
  dispStab += (stability - dispStab) * Math.min(1, dt * 12);
  if (banners.length) { const b = banners[0]; b.t += dt * (banners.length > 1 ? 1.9 : 1); if (b.t > b.dur) banners.shift(); }

  if (state === 'play') {
    timeAlive += dt;
    graceT = Math.max(0, graceT - dt);
    magnetBoostT = Math.max(0, magnetBoostT - dt);
    stability -= drainRate() * dt;
    if (bossT > 0) { bossT -= dt; if (bossT <= 0) endBoss(); }
    if (comboT > 0) { comboT -= dt; if (comboT <= 0) combo = 0; }
    if ((CFG.waveFromBaseScore ? baseScore : score) >= waveScore(wave)) waveUp();
    ftueUpdate(dt);
    if (stability < 25 && mode !== 'zen') { lowT -= dt; if (lowT <= 0) { Snd.tick(clamp(1 - stability / 25, 0.35, 1)); lowT = 0.32 + stability / 25 * 0.5; } }

// ---------------------------------------------------------------- render
const stabHue = p => p > 0.5 ? lerp(42, 188, (p - 0.5) / 0.5) : lerp(0, 42, p / 0.5);
function fullRect() { ctx.fillRect(-offX / scale - 4, -offY / scale - 4, vw / scale + 8, vh / scale + 8); }

const breatheOf = (r, b) => b.glow > 0.01 ? 1 + 0.035 * b.glow * (0.5 + 0.5 * Math.sin(T * 9 + r * 1.3)) : 1;

const atRest = b => SPR && !isSpecial(b) && !b.joker && !b.locked && b.flash === 0 && b.wob === 0 && b.jel < 0.01 &&
  Math.abs(b.dr) < 0.3 && Math.abs(b.vr) < 5 && Math.abs(b.da) < 0.002 && Math.abs(b.sc - 1) < 0.004;
// Enter a block-local frame (origin = block centre, +x = outward) for sprite blits; caller restores.
function spriteFrame(r, s, b) {
  const k = breatheOf(r, b), ac = slotAng(r, s) + b.da;
  ctx.save(); ctx.rotate(ac); ctx.translate(ringMid(r) + b.dr, 0); ctx.scale(k, k);
  return ac;
}

function geom(r, s, b) {
  const k = Math.max(0.05, b.sc) * breatheOf(r, b) * (hitStop > 0 && b.flash > 0 ? 1.12 : 1);
  const mid = ringMid(r) + b.dr;

function drawBoard() {
  const pulse = 0.5 + 0.5 * Math.sin(T * 8);
  ctx.save();
  const sh = shake * motionK();
  ctx.translate(CX + (Math.random() * 2 - 1) * sh, CY + (Math.random() * 2 - 1) * sh);
  const punch = 1 + 0.03 * Math.min(1, boardPunch) * motionK(); ctx.scale(punch, punch);

    ctx.globalAlpha = d.al * clamp((d.r - 58) / 80, 0, 1) * clamp((680 - d.r) / 120, 0, 1);
    ctx.fillRect(Math.cos(d.a) * d.r, Math.sin(d.a) * d.r, d.s, d.s);

  cg.addColorStop(0, `hsla(${hue},100%,65%,${0.5 + corePulse * 0.3})`); cg.addColorStop(1, `hsla(${hue},100%,50%,0)`);

    ctx.fillStyle = 'rgba(8,3,26,0.55)'; ctx.fill();
    let hasBomb = false; for (let s = 0; s < SLOTS; s++) if (grid[r][s] && grid[r][s].bomb) hasBomb = true;

    const b = grid[r][s]; if (b) drawBlock(r, s, b, pulse);

  ctx.restore();
}

function drawBlockSprite(r, s, b, pulse) {
  const S = SPR[r], F = S.fr;

function drawBlock(r, s, b, pulse) {

function drawCore(p, hue) {

// Two passes: normal blend first, then every additive ('lighter') particle, so the composite

}
function drawParticlePass(additive) {

    const k = clamp(p.t / p.life, 0, 1), a = 1 - k;
    switch (p.k) {
      case 'dot':
        ctx.globalAlpha = a; ctx.fillStyle = p.col;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 - k * 0.6), 0, TAU); ctx.fill(); break;
      case 'star':
        ctx.globalAlpha = a; ctx.fillStyle = p.col; starPath(p.x, p.y, p.r * (1 - k * 0.4), p.rot); ctx.fill(); break;
      case 'shard':

        rr(-p.w / 2, -p.h / 2, p.w, p.h, 6); ctx.fillStyle = p.col; ctx.fill();
        rr(-p.w / 2 + 4, -p.h / 2 + 3, p.w - 8, p.h * 0.3, 3); ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fill();
        ctx.restore(); break;

          const y = (1 - uu) * (1 - uu) * p.sy + 2 * (1 - uu) * uu * p.cy + uu * uu * CY;
          ctx.globalAlpha = (1 - j * 0.3) * 0.9;

          ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, 3.2 - j * 0.8, 0, TAU); ctx.fill();

// ---------------------------------------------------------------- UI kit
// Immediate-mode: every frame's draw registers its tap targets in `hits` (drawn later = on top = tested first).
let hits = [], modal = null, modalT = 1, pressId = '', pressT = -9, showDebug = false;
let drawerScroll = 0, drawerDrag = null, resetArmedT = -9, doubled = false;
const boostPick = { bomb: false, shield: false, magnet: false };
const reduceMQ = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : null;
const reducedMotion = () => save.settings.motion === 'reduced' || (save.settings.motion === 'auto' && !!(reduceMQ && reduceMQ.matches));

function closeModal() {

  else modal = null;
  Snd.click();
}
function txtFit(s, x, y, maxW, o) {

  while (size > 9 && ctx.measureText(s).width > maxW) { size -= 1; ctx.font = (o.weight ? o.weight + ' ' : '') + size + 'px ' + (o.font || FD); }

  ctx.save(); ctx.translate(R.x + w / 2, R.y + h / 2); ctx.scale(s, s);

  if (opt.icon) opt.icon(-w / 2 + 22, 2);

    { size: opt.size || 24, color: opt.disabled ? 'rgba(255,255,255,0.6)' : '#fff', stroke: 'rgba(10,4,30,0.45)', sw: 5 });

// --- small vector icons, drawn around (0,0) inside a roundButton
const ICON = {
  pause: () => { ctx.fillStyle = '#fff'; rr(-8, -9, 6, 18, 2); ctx.fill(); rr(2, -9, 6, 18, 2); ctx.fill(); },

  save.gems -= cost; save.upg[U.key]++; persist();
  cardFlash[i] = 1; Snd.buy();

    addPart({ k: 'star', x: R.x + R.w / 2, y: R.y + R.h / 2, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: rand(5, 9), col: k % 2 ? '#ffd84a' : '#fff', rot: 0, vr: rand(-8, 8), life: 0.6, t: 0, drag: 3, g: 200 }, true);

    });

function wrapText(s, x, y, maxW, lh, o) {
  ctx.font = (o.weight ? o.weight + ' ' : '') + o.size + 'px ' + (o.font || FD);
  const words = s.split(' '); let line = '', yy = y;
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { txt(line, x, yy, o); line = w; yy += lh; } else line = test;
  }
  if (line) txt(line, x, yy, o);
}
function finishConsent() {
  save.consent.ts = new Date().toISOString(); modal = null; Snd.click(); persist();
  Ads.loadH5();
  Track.ev('consent', { age: save.consent.age, analytics: save.consent.analytics ? 1 : 0 });
}

// ---------------------------------------------------------------- frame render
// Built once in logical space; its strength is applied with globalAlpha (alpha scales linearly, so identical).
const VIGNETTE = ctx.createRadialGradient(270, 480, 260, 270, 480, 700);
VIGNETTE.addColorStop(0, 'rgba(255,0,40,0)'); VIGNETTE.addColorStop(1, 'rgb(255,20,50)');

function render() {
  hits = [];
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * offX, dpr * offY);

  drawBoard();
  drawParticles();

  // low-stability danger vignette
  if (state === 'play' && dispStab < 30 && mode !== 'zen') {
    ctx.globalAlpha = clamp((1 - dispStab / 30) * (0.35 + 0.25 * Math.sin(T * 10)), 0, 1) * (reducedMotion() ? 0.5 : 1);
    ctx.fillStyle = VIGNETTE; fullRect(); ctx.globalAlpha = 1;
  }

  if (state === 'title') { drawTitle(); drawGemPill(); drawTopLeft(); }
  else if (state === 'over') { drawOver(); drawGemPill(); drawTopLeft(); }
  else drawHUD();
  drawBanners();

  if (state === 'revive') drawRevive();
  if (autoPaused && state === 'play' && !modal) {
    ctx.fillStyle = 'rgba(6,2,18,0.6)'; fullRect();
    txt(t('paused'), 270, 440, { size: 64, stroke: '#1d0840', sw: 10 });
    txt(t('tapResume'), 270, 500, { size: 20, font: FB, weight: 600, color: 'rgba(255,255,255,0.8)' });
  }
  if (resumeT > 0 && state === 'play') txt(String(Math.ceil(resumeT * 2)), 270, 440, { size: 90, stroke: '#1d0840', sw: 12 });
  if (state !== 'revive') drawDrawer();
  drawModal();
  if (flashA > 0 && !reducedMotion()) { ctx.fillStyle = `rgba(${flashCol},${flashA * 0.6})`; fullRect(); }
  if (showDebug) drawDebug();
}
function drawDebug() {
  ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(8, 180, 250, 20 + Object.keys(Track.counts).length * 16);
  let y = 196;
  txt(`q=${Track.queue.length} fps-q=${quality} var=${variantsKey() || '-'}`, 16, y, { size: 12, font: FB, align: 'left', color: '#7dffa0' });
  for (const k in Track.counts) { y += 16; txt(`${k}: ${Track.counts[k]}`, 16, y, { size: 12, font: FB, align: 'left', color: '#fff' }); }
}

// ---------------------------------------------------------------- input
function toggleDrawer(open) {
  drawerOpen = open; Snd.click();
  if (open) { drawerScroll = 0; Track.ev('drawer_open', { state }); }
}
const toLogical = e => ({ x: (e.clientX - offX) / scale, y: (e.clientY - offY) / scale });
function handleTap(x, y) {
  Snd.init();
  // modal or screen buttons first (topmost registered last)
  for (let i = hits.length - 1; i >= 0; i--) {
    const h = hits[i];
    if (inRect(x, y, h)) {
      pressId = h.id; pressT = T;
      const m0 = modal;
      h.fn(x, y);
      // targets were registered for the screen as it was drawn; once a modal opens or closes they are
      // stale until the next frame, so a second tap in the same frame must not reach them
      if (modal !== m0) hits = [];
      return;
    }
  }
  if (modal) return;
  const py = panelY();
  if (y >= py && x >= 10 && x <= 530 && state !== 'dying' && state !== 'revive') { toggleDrawer(true); return; }
  if (autoPaused) { autoPaused = false; resumeT = 0.5; Snd.click(); return; }
  if (state === 'play') tapBoard(x, y);
}
cvs.addEventListener('pointerdown', e => {
  e.preventDefault();
  const p = toLogical(e);
  if (drawerOpen && !modal) {
    const py = panelY();
    if (p.y < py + HANDLE_H) { toggleDrawer(false); return; }
    drawerDrag = { y0: p.y, s0: drawerScroll, moved: false, id: e.pointerId };
    return;
  }
  handleTap(p.x, p.y);
}, { passive: false });
cvs.addEventListener('pointermove', e => {
  if (!drawerDrag || e.pointerId !== drawerDrag.id) return;
  const p = toLogical(e), dy = p.y - drawerDrag.y0;
  if (Math.abs(dy) > 8) drawerDrag.moved = true;
  if (drawerDrag.moved) drawerScroll = clamp(drawerDrag.s0 - dy, 0, drawerMaxScroll());
});
const endDrag = e => {
  if (!drawerDrag || e.pointerId !== drawerDrag.id) return;
  const p = toLogical(e), moved = drawerDrag.moved; drawerDrag = null;
  if (moved || !drawerOpen) return;
  const py = panelY();
  for (let i = 0; i < UPGRADES.length; i++) if (inRect(p.x, p.y, buyRect(py, i))) { buy(i); return; }
};
cvs.addEventListener('pointerup', endDrag);
cvs.addEventListener('pointercancel', e => { if (drawerDrag && e.pointerId === drawerDrag.id) drawerDrag = null; });
cvs.addEventListener('wheel', e => { if (drawerOpen) { e.preventDefault(); drawerScroll = clamp(drawerScroll + e.deltaY * 0.6, 0, drawerMaxScroll()); } }, { passive: false });
cvs.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (e.repeat) return;                       // holding Space must not chain-restart
  if (modal && modal.kind === 'consent') return;
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    if (modal) { if (modal.kind === 'pause') resumeGame(); return; }
    if (state === 'title' || (state === 'over' && overT > 0.5)) { Snd.init(); doubled = false; pressPlay(); }
    else if (autoPaused) { autoPaused = false; resumeT = 0.5; Snd.click(); }
  } else if (e.code === 'Escape') {
    if (modal) { if (modal.kind === 'pause') resumeGame(); else if (modal.kind !== 'ad') closeModal(); }
    else if (drawerOpen) toggleDrawer(false);
    else if (state === 'play') pauseGame();
  } else if (e.code === 'KeyP') { if (state === 'play') { if (paused) resumeGame(); else pauseGame(); } }
  else if (e.code === 'KeyU') { if (state !== 'dying' && state !== 'revive' && !modal) toggleDrawer(!drawerOpen); }
  else if (e.code === 'KeyM') toggleMute();
  else if (e.code === 'KeyD' && DEBUG) showDebug = !showDebug;
});
document.addEventListener('visibilitychange', () => {
  perfSkip = 60;
  if (document.hidden) {
    if (state === 'play' && !paused) { autoPaused = true; Track.ev('pause', { source: 'visibility' }); }
    persist(); Track.flush();
  }
});

// Adaptive quality: if the device can't hold ~48fps, drop to 1x pixel density, then drop the swirl layer.
let quality = 2, perfN = 0, perfAcc = 0, perfSkip = 90;
function perfWatch(dt) {
  if (quality === 0 || document.hidden) return;
  if (perfSkip > 0) { perfSkip--; return; }
  perfN++; perfAcc += dt;
  if (perfN < 120) return;
  const avg = perfAcc / perfN; perfN = 0; perfAcc = 0;
  if (avg <= 1 / 48) return;
  quality--; perfSkip = 30;
  Track.ev('perf_drop', { quality, avg_fps: Math.round(1 / avg) });
  if (quality === 1 && (window.devicePixelRatio || 1) > 1) { dprCap = 1; resize(); }
  else { quality = 0; swEl.style.display = 'none'; }
}
window.addEventListener('pagehide', () => { persist(); Track.flush(); });
window.addEventListener('resize', queueResize);
window.addEventListener('orientationchange', () => setTimeout(queueResize, 120));

// ---------------------------------------------------------------- boot
applyTheme(save.theme);
resize();
fillBoardFresh(true);
Quests.ensure(); Season.ensure();
fetchConfig();
if (!save.consent.age) openModal({ kind: 'consent', step: 'age' });
else Ads.loadH5();
Track.ev('app_open', { first: save.stats.runs === 0 ? 1 : 0, dpr: Math.round(dpr * 10) / 10, quality });
// F-009: offline support when served over http(s); file:// can't register a service worker
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (!(dt > 0)) dt = 0; if (dt > 0.05) dt = 0.05;
  perfWatch(dt);
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Hook for automated testing (docs/tools/smoke.py, parity.py). Absent in production builds/URLs, so the
// console can't be used to edit stability or replay seeds.
if (DEBUG) window.__vortex = {
  get state() { return state; }, get stability() { return stability; }, get score() { return score; },
  get quality() { return quality; }, get wave() { return wave; }, get runSeed() { return runSeed; },
  get clusters() { return clusters; }, get save() { return save; }, get modal() { return modal && modal.kind; },
  get hits() { return hits.map(h => h.id); }, get mode() { return mode; }, get ftueStep() { return ftueStep; },
  grid, ringAng, CX, CY, ringMid, slotAng, blockWorld, settle, computeClusters, CFG: () => CFG,
  toScreen: (x, y) => ({ x: x * scale + offX, y: y * scale + offY }),
  setStability: v => { stability = v; }, setWave: v => { wave = v; }, seedRng, rng, fillBoardFresh, startGame, Track, Ads,
  tapHit: id => { const h = hits.find(h => h.id === id); if (h) handleTap(h.x + h.w / 2, h.y + h.h / 2); return !!h; },
};
})();
